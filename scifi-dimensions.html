<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Merriweather"/>
    <link rel="stylesheet" href="scifi.css"/>
    <title>Dimensions Calculator</title>
    <style>
      *, *:before, *:after {
	  box-sizing: inherit;
      }
      body, h1, h2, h3, h4 {
	  margin: 10px 0;
	  font-family: "Merriweather";
      }
      body {
	  box-sizing: border-box;
	  line-height: 1.5;
	  font-size: 18px;
	  text-align: justify;
	  justify-content: center;
	  display: flex;
      }
      .container {
	  background: var(--navbg);
	  padding: 40px;
	  margin: 40px;
	  width: 100%;
	  max-width: 800px;
      }
      h1 {
	  text-align: center;
	  font-size: 24px;
	  margin-bottom: 30px;
	  color: var(--head);
      }
      .slider-container {
	  margin-bottom: 40px;
	  padding: 30px;
	  background: white;
      }
      .value-display {
	  text-align: center;
	  margin-bottom: 20px;
      }
      .value-number {
	  font-size: 24px;
	  color: var(--h1);
      }
      .slider-controls {
	  display: flex;
	  gap: 15px;
	  align-items: center;
      }
      .control-btn {
	  background: var(--navbg);
	  border: none;
	  color: white;
	  width: 40px;
	  height: 40px;
	  font-size: 20px;
	  cursor: pointer;
      }
      .control-btn:hover {
	  background: white;
	  border: 1px solid var(--navbg);
	  color: var(--navbg);
      }
      input[type="range"] {
	  flex: 1;
	  height: 10px;
	  background: var(--navbg);
	  -webkit-appearance: none;
      }
      input[type="range"]::-webkit-slider-thumb,
      input[type="range"]::-moz-range-thumb {
	  -webkit-appearance: none;
	  appearance: none;
	  width: 30px;
	  height: 30px;
	  border-radius: 50%;
	  background: var(--navbg);
	  box-shadow: 0 0 10px #0008;
	  cursor: pointer;
      }
      table {
	  width: 100%;
	  font-size:80%;
	  border-collapse: separate;
	  border-spacing: 0;
	  background: white;
	  padding: 0px 30px 10px;
      }
      th {
	  border-top: none;
	  padding: 8px;
	  text-align: left;
	  color: var(--h1);
	  width: 70%;
      }
      td {
	  border-top: 1px solid var(--tdo);
	  padding: 8px;
	  text-align: left;
	  color: var(--tdo);
      }
      th:last-child, td:last-child {
	  width: 30%;
	  text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Dimensions</h1>
      <div class="slider-container">
	<div class="value-display">
          <div class="value-number" id="dim-num">0</div>
	</div>
	<div class="slider-controls">
          <button class="control-btn" id="decreaseBtn">−</button>
          <input type="range" min="-50" max="50" value="0" id="roll">
          <button class="control-btn" id="increaseBtn">+</button>
	</div>
      </div>
      <table>
	<thead>
          <tr>
            <th>Parameter</th>
            <th>Value</th>
          </tr>
	</thead>
	<tbody>
          <tr>
            <td>Accuracy</td>
            <td id="dim-acc">—</td>
          </tr>
          <tr>
            <td>Healing</td>
            <td id="dim-hea">—</td>
          </tr>
          <tr>
            <td>Initiative</td>
            <td id="dim-ini">—</td>
          </tr>
          <tr>
            <td>Move</td>
            <td id="dim-mov">—</td>
          </tr>
          <tr>
            <td>Time/Speed</td>
            <td id="dim-tim">—</td>
          </tr>
          <tr>
            <td>Yield</td>
            <td id="dim-yie">—</td>
          </tr>
          <tr>
            <td>Accident</td>
            <td id="dim-dan">—</td>
          </tr>
	</tbody>
      </table>
    </div>
    <script>
      const roll = document.getElementById("roll");
      const decreaseBtn = document.getElementById("decreaseBtn");
      const increaseBtn = document.getElementById("increaseBtn");
      const dimnum = document.getElementById("dim-num");
      const dimacc = document.getElementById("dim-acc");
      const dimhea = document.getElementById("dim-hea");
      const dimini = document.getElementById("dim-ini");
      const dimmov = document.getElementById("dim-mov");
      const dimtim = document.getElementById("dim-tim");
      const dimyie = document.getElementById("dim-yie");
      const dimdan = document.getElementById("dim-dan");

      function updateValues() {
	  const v = roll.value / 10;
	  dimnum.textContent = roll.value;
	  dimacc.textContent = Math.round(100 * (1 - 1 / (2 * 2 ** v))) + " % – " + Math.round(100 / (1 - 1 / (2 * 2 ** v))) + " %";
	  dimhea.textContent = Math.round(8 * 2 ** -v) / 8 + " day/pt";
	  dimini.textContent = Math.round(32 * 2 ** -v) / 8 + " s";
	  dimmov.textContent = Math.round(20 * 2 ** (v / 2)) / 8 + " m/s = " + Math.round(72 * 2 ** (v / 2)) / 8 + " km/h";
	  dimtim.textContent = Math.round(100 * 2 ** -v) + " %";
	  dimyie.textContent = Math.round(8 * 2 ** v) / 8;
	  dimdan.textContent = Math.max(0, Math.min(100, - 20 * v)) + " %";
      }

      roll.oninput = updateValues;
      decreaseBtn.onclick = function() {
	  const currentValue = parseInt(roll.value);
	  if (currentValue > parseInt(roll.min)) {
              roll.value = currentValue - 1;
              updateValues();
	  }
      };
      increaseBtn.onclick = function() {
	  const currentValue = parseInt(roll.value);
	  if (currentValue < parseInt(roll.max)) {
              roll.value = currentValue + 1;
              updateValues();
	  }
      };
      updateValues();
    </script>
  </body>
</html>
